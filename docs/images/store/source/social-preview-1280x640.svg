<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#f7ebdc"/>

  <g fill="#f1e4d3">
    <rect x="0" y="96" width="150" height="30"/>
    <rect x="1050" y="150" width="230" height="34"/>
    <rect x="0" y="470" width="190" height="32"/>
    <rect x="1140" y="520" width="140" height="30"/>
    <rect x="960" y="60" width="90" height="26"/>
  </g>

  <text x="96" y="236"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="92" font-weight="700" letter-spacing="2"
        fill="#1a1a1a">ORATIONES</text>

  <text x="99" y="306"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="400"
        fill="#1a1a1a">Catholic prayers for Pebble Time 2</text>

  <text x="99" y="424"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" letter-spacing="1.5"
        fill="#8b1a2d">LARGE PRINT  ·  HIGH CONTRAST  ·  OFFLINE</text>

  <!-- mark: proportions measured from the original 720x320 banner, scaled to
       ring outer radius 154. The cross's vertical bar crosses the ring stroke
       once at the top right and stops inside the ring. The ring is masked by
       the bar (plus a small gap) so the break follows the stroke exactly. -->
  <defs>
    <mask id="ring-break">
      <rect width="1280" height="640" fill="#fff"/>
      <!-- knock the bar (widened by a 5px gap each side) out of the ring -->
      <rect x="1069" y="157" width="40" height="232" fill="#000"/>
    </mask>
  </defs>
  <g>
    <circle cx="1000" cy="352" r="132" fill="none" stroke="#1a1a1a"
            stroke-width="44" mask="url(#ring-break)"/>
    <rect x="1074" y="162" width="30" height="222" fill="#8b1a2d"/>
    <rect x="1029" y="217" width="124" height="32" fill="#8b1a2d"/>
  </g>
</svg>
